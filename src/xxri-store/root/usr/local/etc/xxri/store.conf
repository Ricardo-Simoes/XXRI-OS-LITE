# xxri-store engine configuration.
#
# Every setting uses ${VAR:=default}, so the environment wins over this file
# (a mirror, staging repository or QA run needs no image change):
#   REMOTE_BASE=http://mirror.lan/store xxri-store refresh

# the only source of application metadata
: "${REPO_URL:=https://repo.xxri.flows.best/i686.json}"
: "${REMOTE_BASE:=https://repo.xxri.flows.best}"

# How old the cached repository may get before a refresh is due (seconds).
: "${CACHE_MAX_AGE:=86400}"

# Tiny Core extension mirror, for apps published as .tcz (no 32-bit AppImage
# upstream) and their dependency chains.
: "${TCZ_BASE:=http://repo.tinycorelinux.net/16.x/x86/tcz}"
