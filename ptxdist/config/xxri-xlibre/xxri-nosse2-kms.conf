# Xorg on a KMS device, processor without SSE2 (~/.xsession passes this with
# -config).  Tiny Core's Mesa is i686 code (CMOV) built for SSE2: glamor and
# GLX would run it and die with SIGILL.  modesetting without glamor, no GLX.
# See docs/cpu-baseline.md and docs/x-server.md.
Section "Device"
    Identifier "xxri-kms"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection
Section "Module"
    Disable "glx"
EndSection
