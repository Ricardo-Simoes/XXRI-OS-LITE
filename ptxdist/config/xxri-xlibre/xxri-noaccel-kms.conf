# Xorg on a KMS device whose GPU Mesa cannot accelerate safely: nouveau on
# NV04 .. NV4x (~/.xsession legacy_nv passes this with -config).  modesetting
# without glamor - a shadow framebuffer, rendered in software; GLX stays and
# is rendered by llvmpipe.  See docs/x-server.md.
Section "Device"
    Identifier "xxri-kms"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection
